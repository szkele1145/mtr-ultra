plugins {
	// loom 版本与 Gradle 8.11 的兼容矩阵：1.6.12 有 Problems API 崩溃、
	// 1.10.5 要求 Gradle 8.12+；1.9.2 是支持 Gradle 8.11 的稳定版
	id 'fabric-loom' version '1.9.2'
}

// [multi-version] 构建目标 MC 版本由 -PbuildVersion 指定（默认 1.20.1）：
//   gradlew build -PbuildVersion=1.19.4
// 版本矩阵（fabric-api/ModMenu/编译目标 jar 的依赖坐标）见 docs/multi-version-plan.md
def targetMcVersion = project.hasProperty("buildVersion") ? project.buildVersion : "1.20.1"

def depMatrix = [
	"1.20.1": [
		fabricApi: "net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1",
		modMenu : "com.terraformersmc:modmenu:7.2.2",
		// 编译目标 jar（YMTR 优先，无 YMTR 的版本用官方 MTR）
		targetJar: "libs/ymtr-fabric-1.20.1.jar",
		runtimeExtra: "dev.architectury:architectury-fabric:9.2.14"
	],
	"1.19.4": [
		fabricApi: "net.fabricmc.fabric-api:fabric-api:0.87.2+1.19.4",
		modMenu : "com.terraformersmc:modmenu:6.3.1",
		// 1.19.4 无 YMTR —— 用官方 MTR 3.2.2-hotfix-1
		targetJar: "libs/mtr-fabric-1.19.4.jar",
		runtimeExtra: null
	],
	"1.19.2": [
		fabricApi: "net.fabricmc.fabric-api:fabric-api:0.77.0+1.19.2",
		modMenu : "com.terraformersmc:modmenu:4.2.0-beta.2",
		targetJar: "libs/ymtr-fabric-1.19.2.jar",
		runtimeExtra: "dev.architectury:architectury-fabric:6.6.92"
	],
	"1.18.2": [
		fabricApi: "net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2",
		modMenu : "com.terraformersmc:modmenu:3.2.5",
		// 1.18.2 无 YMTR —— 用官方 MTR 3.2.2-hotfix-1（签名已 javap 核对一致）
		targetJar: "libs/mtr-fabric-1.18.2.jar",
		runtimeExtra: null
	]
]
def deps = depMatrix[targetMcVersion]
if (deps == null) {
	throw new GradleException("Unsupported buildVersion: ${targetMcVersion}. Supported: ${depMatrix.keySet()}")
}

// [命名规范] 产物文件名统一为: mtr-turbo-<mod版本>-<mc版本>-<加载器>.jar
// 例: mtr-turbo-1.0.4-1.20.1-fabric.jar
// loom 的 remapJar 会自动追加 "-${version}"，故 archivesName 不含版本、
// 由 version 字段拼接中间段：archivesName = "mtr-turbo-${modVer}-${mc}-fabric"
// 会变成 ...-fabric-1.0.4+1.20.1(版本重复且带+)。改为直接钉死最终名：
tasks.named('remapJar') {
	archiveFileName = "mtr-turbo-${project.mod_version}-${targetMcVersion}-fabric.jar"
}
tasks.named('jar') {
	archiveFileName = "mtr-turbo-${project.mod_version}-${targetMcVersion}-fabric-dev.jar"
}

// [multi-version] 1.19.4 及以下无 GuiGraphics（1.20 引入），ModMenu 配置屏
// 仅 1.20.x 构建；1.19.x 版本不带配置屏（config/mtr-turbo.json 手编仍可用）
boolean hasModMenuScreen = targetMcVersion.startsWith("1.20")

version = "${project.mod_version}+${targetMcVersion}"
group = project.maven_group

repositories {
	// 腾讯镜像前置，境内加速；fabric maven 保底（loom 插件依赖与 fabric-api 均在 fabric maven）
	maven {
		name = "Tencent"
		url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/"
	}
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	// architectury-api 所在仓库
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}
	// ModMenu 所在仓库
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${targetMcVersion}"
	mappings loom.layered() {
		officialMojangMappings()
	}
	// 编译目标 jar：loom 会自动 remap 到 named（Mojang 映射）编译环境
	modImplementation files(deps.targetJar)
	modImplementation "net.fabricmc:fabric-loader:0.15.11"
	modImplementation deps.fabricApi
	// ModMenu：配置屏入口点（仅 1.20.x，1.19.x 无 GuiGraphics）
	if (hasModMenuScreen) {
		modCompileOnly deps.modMenu
	}

	// 运行时环境：目标 mod 作为 mod 装入 mods 目录
	modRuntimeOnly files(deps.targetJar)
	if (deps.runtimeExtra != null) {
		modRuntimeOnly deps.runtimeExtra
	}
}

// refmap 名与 mtr-ultra.mixins.json 里声明的 "mtr-ultra.refmap.json" 对齐
loom {
	mixin {
		defaultRefmapName = "mtr-ultra.refmap.json"
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// [multi-version] 1.19.x 构建排除 ModMenu 配置屏（GuiGraphics 依赖）。
// 1.18.2 额外排除 stats 命令注册（fabric-api 0.77.0+1.18.2 无 command v2 包）。
sourceSets {
	main {
		java {
			srcDir 'fabric/src/main/java'
			if (!hasModMenuScreen) {
				exclude 'mtrultra/fabric/MtrUltraModMenuApi.java'
			}
			if (targetMcVersion == "1.18.2") {
				exclude 'mtrultra/fabric/MtrUltraCommands.java'
			}
		}
		resources {
			srcDir 'fabric/src/main/resources'
		}
	}
}

// [multi-version] 1.19.x 的 fabric.mod.json 需移除 modmenu 入口点。
// 1.18.2 额外提示无 stats 命令（changelog 已注明）。
// 纯文本正则在多形态缩进/逗号下脆弱（实测 MalformedJson: 尾逗号残留），
// 改用 JsonSlurper/JsonBuilder 结构化处理——只重写这个小文件，安全可靠。
processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	doLast {
		if (!hasModMenuScreen) {
			def fmlFile = file("${buildDir}/resources/main/fabric.mod.json")
			def json = new groovy.json.JsonSlurper().parseText(fmlFile.getText('UTF-8'))
			json.entrypoints.remove('modmenu')
			json.remove('suggests')
			fmlFile.setText(new groovy.json.JsonBuilder(json).toPrettyString(), 'UTF-8')
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 17
}

// ───────────────────────────────────────────────────────────────────────────
// mixin 引用审计（字节码级）
//
// 背景：turbo 全部 mixin 都是 remap=false + 手写符号，且注入器都带 require=0
// ⇒ 描述符/方法名写错**不会崩**，而是静默失效（用户以为装了优化，实际没生效）。
// RenderTrainsMixin 从 v0.1.0 起就是这么失效的（第一个参数误写为 MC Entity）。
//
// 本任务把每个注入器的 method= 与 @At(target=...) 里的引用，
// 逐个拿到真实目标 jar 里验证存在性。
// ───────────────────────────────────────────────────────────────────────────
def registerMixinAudit = { String taskName, String srcDir, List<String> jarNames ->
	tasks.register(taskName, JavaExec) {
		group = 'verification'
		description = "审计 ${srcDir} 的 mixin 引用是否在目标 jar 中真实存在（防静默失效）"

		def srcFile = file('tools/AuditTurboMixinRefs.java')
		def outDir = layout.buildDirectory.dir("verify-mixin-${taskName}").get().asFile
		def srcRoot = file(srcDir)

		inputs.file(srcFile)
		inputs.dir(srcRoot)
		outputs.dir(outDir)

		doFirst {
			outDir.mkdirs()

			def asmCfg = configurations.detachedConfiguration(
					dependencies.create('org.ow2.asm:asm:9.7.1'),
					dependencies.create('org.ow2.asm:asm-tree:9.7.1')
			)
			asmCfg.transitive = false
			def asmCp = asmCfg.files.collect { it.absolutePath }.join(File.pathSeparator)

			def compiler = javax.tools.ToolProvider.getSystemJavaCompiler()
			if (compiler == null) {
				throw new GradleException('需要 JDK（不是 JRE）来编译 AuditTurboMixinRefs.java')
			}
			def fm = compiler.getStandardFileManager(null, null, null)
			def units = fm.getJavaFileObjects(srcFile)
			def opts = ['-d', outDir.absolutePath, '-cp', asmCp, '-encoding', 'UTF-8', '-nowarn'] as List
			def compilerTask = compiler.getTask(null, fm, null, opts, null, units)
			def ok = compilerTask.call()
			fm.close()
			if (!ok) throw new GradleException('AuditTurboMixinRefs.java 编译失败')

			def asmCfg2 = configurations.detachedConfiguration(
					dependencies.create('org.ow2.asm:asm:9.7.1'),
					dependencies.create('org.ow2.asm:asm-tree:9.7.1')
			)
			asmCfg2.transitive = false
			classpath = files(outDir) + asmCfg2

			def argsList = [srcRoot.absolutePath]
			jarNames.each { n ->
				def j = file("libs/${n}")
				if (!j.exists()) throw new GradleException("缺少目标 jar: ${j}")
				argsList << j.absolutePath
			}
			// ★ [1.1.8] 传 refmap：remap=true 的成员用 Mojmap 描述符，
			//   审计器需按 refmap 转换后再比对，否则假阳性。
			def refmapFile = file("${buildDir}/classes/java/main/mtr-ultra.refmap.json")
			if (refmapFile.exists()) {
				argsList << "--refmap" << refmapFile.absolutePath
			}
			args = argsList
		}

		mainClass = 'AuditTurboMixinRefs'
		// ★ 中文路径：Java 默认按 GBK 解码命令行参数 ⇒ 路径乱码 ⇒ 读不到 jar/refmap。
		//   显式指定 UTF-8（jvmArgs 必须在 doFirst 之前设置，args 变化不影响 jvmArgs）。
		jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.jnu.encoding=UTF-8'
	}
}

registerMixinAudit('auditMixinRefsFabric', 'fabric/src/main/java', [
		'ymtr-fabric-1.20.1.jar', 'mtr-fabric-1.19.4.jar',
		'ymtr-fabric-1.19.2.jar', 'mtr-fabric-1.18.2.jar'
])

registerMixinAudit('auditMixinRefsForge', 'forge-project/src/main/java', [
		'ymtr-forge-1.20.1.jar', 'mtr-forge-1.19.4.jar'
])

tasks.register('auditMixinRefs') {
	group = 'verification'
	description = 'fabric + forge 两侧 mixin 引用审计的聚合入口'
	dependsOn 'auditMixinRefsFabric', 'auditMixinRefsForge'
}
