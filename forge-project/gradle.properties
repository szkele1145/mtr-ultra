org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.java.home=F:/tools/jdk17
org.gradle.java.installations.paths=F:/tools/jdk17
org.gradle.daemon=false
org.gradle.caching=true

# 网络代理（本机系统代理；wrapper 分发版与构建期依赖仓库均走此代理）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532
systemProp.http.nonProxyHosts=localhost|127.0.0.1|mirrors.cloud.tencent.com|maven.aliyun.com|bmclapi2.bangbang93.com
systemProp.https.nonProxyHosts=localhost|127.0.0.1|mirrors.cloud.tencent.com|maven.aliyun.com|bmclapi2.bangbang93.com

# 网络不稳：仓库下载重试（Gradle 内部参数）
org.gradle.internal.repository.max.tentatives=10
org.gradle.internal.repository.initial.backoff=1500

# Mod Properties
mod_version=1.0.2
maven_group=mtrultra
archives_base_name=mtr-ultra-forge

# Architectury Loom：单模块 forge 布局必须显式声明平台
# （mtr-ante 多模块靠 architectury-plugin 的 forge() 自动设置）
loom.platform=forge
